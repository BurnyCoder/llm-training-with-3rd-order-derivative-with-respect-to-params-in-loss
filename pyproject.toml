[project]
name = "thirdloss"
version = "0.1.0"
description = "Preregistered parameter-derivative experiments for causal language models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.15.0", "numpy>=2", "transformers>=5.24,<6", "peft>=0.22,<1",
    "huggingface-hub>=1", "tokenizers>=0.22", "safetensors>=0.5",
    "pyarrow>=20", "filelock>=3", "httpx>=0.27", "python-dotenv>=1",
    "matplotlib>=3.10", "reportlab>=4", "scipy>=1.14",
]

[project.scripts]
thirdloss = "thirdloss.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pypdf>=5"]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
